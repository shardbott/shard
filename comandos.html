<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comandos - Shard Bot</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }

        :root {
            --bg-base: #030708;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --glass-bg: rgba(15, 22, 18, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
            --neon-green: #00E676;
        }

        body {
            background-color: var(--bg-base); color: var(--text-main);
            font-family: 'Inter', sans-serif; margin: 0; padding: 0;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.1), transparent 50%);
            background-attachment: fixed; min-height: 100vh;
        }

        /* Header Simples com Voltar */
        header {
            display: flex; align-items: center; padding: 20px 24px;
            background: rgba(3, 7, 8, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100;
        }
        .btn-voltar {
            color: var(--text-main); text-decoration: none; font-size: 16px; font-weight: 600;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-voltar:hover { color: var(--neon-green); }
        .btn-voltar i { font-size: 24px; }

        /* Container Principal */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 36px; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -1px; }
        p.desc { color: var(--text-muted); margin: 0 0 30px 0; font-size: 16px; }

        /* Barra de Pesquisa */
        .search-box {
            position: relative; margin-bottom: 30px; width: 100%;
        }
        .search-box i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            font-size: 22px; color: var(--text-muted);
        }
        .search-input {
            width: 100%; background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 16px 20px 16px 48px; border-radius: 16px; color: #fff;
            font-size: 16px; font-family: 'Inter', sans-serif; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .search-input:focus { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0, 230, 118, 0.2); }

        /* Filtros */
        .filtros { display: flex; gap: 10px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px; }
        .filtros::-webkit-scrollbar { height: 4px; }
        .filtros::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .btn-filtro {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; transition: 0.3s;
        }
        .btn-filtro.active { background: var(--neon-green); color: #000; border-color: var(--neon-green); }

        /* Lista de Comandos */
        .comandos-grid { display: flex; flex-direction: column; gap: 15px; }
        
        .cmd-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px; display: flex; justify-content: space-between;
            align-items: center; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .cmd-card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        .cmd-info h3 { margin: 0 0 5px 0; color: var(--neon-green); font-family: monospace; font-size: 18px; }
        .cmd-info p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.5; }
        
        .btn-copy {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            width: 44px; height: 44px; border-radius: 12px; color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; transition: 0.3s; flex-shrink: 0;
        }
        .btn-copy:hover { background: rgba(255,255,255,0.1); }
        .btn-copy.copied { background: rgba(0, 230, 118, 0.2); color: var(--neon-green); border-color: var(--neon-green); }

        /* Mensagem de Vazio */
        .no-results { display: none; text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-voltar"><i class='bx bx-chevron-left'></i> Voltar ao Início</a>
    </header>

    <div class="container">
        <h1>Comandos Shard</h1>
        <p class="desc">Encontre e copie os comandos para usar no WhatsApp.</p>

        <div class="search-box">
            <i class='bx bx-search'></i>
            <input type="text" class="search-input" id="search" placeholder="Buscar comando... (ex: sticker, play)">
        </div>

        <div class="filtros">
            <button class="btn-filtro active" onclick="filtrar('todos')">Todos</button>
            <button class="btn-filtro" onclick="filtrar('admin')">Admin</button>
            <button class="btn-filtro" onclick="filtrar('midia')">Mídia & Edição</button>
            <button class="btn-filtro" onclick="filtrar('audio')">Áudios & Música</button>
            <button class="btn-filtro" onclick="filtrar('ia')">IA & Úteis</button>
            <button class="btn-filtro" onclick="filtrar('jogos')">Jogos</button>
            <button class="btn-filtro" onclick="filtrar('diversao')">Diversão</button>
            <button class="btn-filtro" onclick="filtrar('filtros')">Filtros (Fotos)</button>
            <button class="btn-filtro" onclick="filtrar('memes')">Memes</button>
            <button class="btn-filtro" onclick="filtrar('texto')">Ferramentas</button>
        </div>

        <div class="comandos-grid" id="lista-comandos">
            </div>
        
        <div class="no-results" id="no-results">
            <i class='bx bx-ghost' style="font-size: 40px; margin-bottom: 10px; color: #555;"></i>
            <p>Nenhum comando encontrado para esta busca.</p>
        </div>
    </div>

    <script>
        const comandos = [
            // ADMINISTRAÇÃO
            { cmd: "/ban", desc: "Remove um membro do grupo (marque ou responda a mensagem).", cat: "admin" },
            { cmd: "/del", desc: "Apaga uma mensagem do grupo (responda a mensagem).", cat: "admin" },
            { cmd: "/promover", desc: "Dá administrador para um usuário do grupo.", cat: "admin" },
            { cmd: "/rebaixar", desc: "Tira o administrador de um usuário.", cat: "admin" },
            { cmd: "/bemvindo", desc: "Ativa/Desativa e configura a mensagem de boas vindas [on/off/texto].", cat: "admin" },
            { cmd: "/regras", desc: "O bot envia a descrição do grupo no chat.", cat: "admin" },
            { cmd: "/link", desc: "Gera o link de convite do grupo atual.", cat: "admin" },
            { cmd: "/grupo", desc: "Abre ou fecha o grupo para mensagens [abrir/fechar].", cat: "admin" },
            { cmd: "/todos", desc: "Marca silenciosamente todos os integrantes do grupo.", cat: "admin" },
            { cmd: "/prefix", desc: "Muda o prefixo de comandos do bot.", cat: "admin" },

            // MÍDIA E EDIÇÃO
            { cmd: "/s", desc: "Transforma a foto ou vídeo em figurinha animada/estática.", cat: "midia" },
            { cmd: "/qc", desc: "Cria uma figurinha de citação estilo balão de mensagem.", cat: "midia" },
            { cmd: "/removebg", desc: "Remove o fundo de uma imagem e a transforma em figurinha.", cat: "midia" },
            { cmd: "/emojimix", desc: "Junta dois emojis diferentes e cria uma figurinha híbrida (ex: /emojimix 😭 🐢).", cat: "midia" },
            { cmd: "/togif", desc: "Transforma uma figurinha animada de volta em um vídeo (mp4).", cat: "midia" },
            { cmd: "/efeito", desc: "Aplica efeitos na voz de um áudio [fino/grosso].", cat: "midia" },

            // ÁUDIOS E MÚSICA
            { cmd: "/play", desc: "Baixa o áudio de uma música do YouTube pelo nome.", cat: "audio" },
            { cmd: "/tomp3", desc: "Transforma um vídeo enviado no chat em áudio MP3.", cat: "audio" },
            { cmd: "/tts", desc: "O bot fala o texto que você digitar (Texto para Áudio).", cat: "audio" },
            { cmd: "/lyrics", desc: "Busca e envia a letra de uma música.", cat: "audio" },
            { cmd: "/itunes", desc: "Busca informações sobre uma música no iTunes.", cat: "audio" },

            // IA E UTILIDADES
            { cmd: "/ia", desc: "Faz uma pergunta ou pedido para a Inteligência Artificial (ChatGPT).", cat: "ia" },
            { cmd: "/imagem", desc: "Pede para a IA gerar uma imagem baseada na sua descrição.", cat: "ia" },
            { cmd: "/wiki", desc: "Faz uma busca rápida na Wikipédia.", cat: "ia" },
            { cmd: "/clima", desc: "Mostra a previsão do tempo de uma cidade.", cat: "ia" },
            { cmd: "/cep", desc: "Consulta informações sobre um CEP brasileiro.", cat: "ia" },
            { cmd: "/qrcode", desc: "Gera um QR Code a partir de um texto ou link.", cat: "ia" },
            { cmd: "/print", desc: "Tira print de um site e te envia a imagem.", cat: "ia" },
            { cmd: "/imdb", desc: "Busca informações sobre filmes ou séries.", cat: "ia" },
            { cmd: "/periodictable", desc: "Mostra dados sobre um elemento da tabela periódica.", cat: "ia" },

            // JOGOS E COMPETIÇÃO
            { cmd: "/rank", desc: "Mostra o ranking de quem mais envia mensagens no grupo [semanal/total].", cat: "jogos" },
            { cmd: "/anagrama", desc: "Jogo de desembaralhar letras para formar a palavra.", cat: "jogos" },
            { cmd: "/forca", desc: "Inicia um jogo da forca no chat.", cat: "jogos" },
            { cmd: "/quiz", desc: "Inicia um jogo de perguntas e respostas.", cat: "jogos" },
            { cmd: "/ppt", desc: "Jogue Pedra, Papel ou Tesoura contra o bot.", cat: "jogos" },
            { cmd: "/dado", desc: "Gira um dado virtual.", cat: "jogos" },
            { cmd: "/moeda", desc: "Joga cara ou coroa.", cat: "jogos" },

            // DIVERSÃO E ZOEIRA
            { cmd: "/presentear", desc: "Dá um presente virtual para alguém do grupo (@pessoa item).", cat: "diversao" },
            { cmd: "/desafio", desc: "O bot envia um desafio aleatório para você.", cat: "diversao" },
            { cmd: "/verdade", desc: "O bot faz uma pergunta polêmica.", cat: "diversao" },
            { cmd: "/8ball", desc: "Faça uma pergunta de sim/não para a bola mágica.", cat: "diversao" },
            { cmd: "/gado", desc: "Mede o nível de gadice de alguém.", cat: "diversao" },
            { cmd: "/gay", desc: "Mede a porcentagem gay de alguém.", cat: "diversao" },
            { cmd: "/gostoso", desc: "Calcula o nível de beleza de alguém.", cat: "diversao" },
            { cmd: "/bater", desc: "Dê um tapa virtual em alguém.", cat: "diversao" },
            { cmd: "/beijar", desc: "Mande um beijo para alguém do grupo.", cat: "diversao" },
            { cmd: "/abracar", desc: "Mande um abraço virtual.", cat: "diversao" },
            { cmd: "/biscoito", desc: "Dá um biscoito para alguém.", cat: "diversao" },
            { cmd: "/cantada", desc: "O bot envia uma cantada aleatória.", cat: "diversao" },
            { cmd: "/ship", desc: "Shippa (combina) duas pessoas do grupo aleatoriamente.", cat: "diversao" },
            { cmd: "/mock", desc: "tRaNsFoRmA sEu TeXtO nIsSo.", cat: "diversao" },
            { cmd: "/emojipasta", desc: "Entope o seu texto com emojis aleatórios.", cat: "diversao" },
            { cmd: "/reverse", desc: "Inverte as letras do texto digitado.", cat: "diversao" },
            { cmd: "/facts", desc: "Envia um fato aleatório e interessante.", cat: "diversao" },

            // FILTROS DE IMAGEM
            { cmd: "/ad", desc: "Cria uma figurinha de anúncio com sua foto.", cat: "filtros" },
            { cmd: "/blur", desc: "Desfoca uma imagem enviada.", cat: "filtros" },
            { cmd: "/clown", desc: "Aplica filtro de palhaço na foto.", cat: "filtros" },
            { cmd: "/colorify", desc: "Muda a cor predominante da imagem.", cat: "filtros" },
            { cmd: "/communism", desc: "Coloca a foice e martelo na imagem.", cat: "filtros" },
            { cmd: "/drip", desc: "Coloca a jaqueta Drip de grife na sua foto.", cat: "filtros" },
            { cmd: "/greyscale", desc: "Deixa a foto em preto e branco.", cat: "filtros" },
            { cmd: "/gun", desc: "Coloca uma mira de arma apontando para a foto.", cat: "filtros" },
            { cmd: "/huerotate", desc: "Aplica rotação de matiz nas cores da imagem.", cat: "filtros" },
            { cmd: "/invert", desc: "Aplica o efeito negativo na foto.", cat: "filtros" },
            { cmd: "/jail", desc: "Coloca a pessoa da foto atrás das grades.", cat: "filtros" },
            { cmd: "/mnm", desc: "Transforma em um M&M vermelho.", cat: "filtros" },
            { cmd: "/nokia", desc: "Coloca a imagem na tela de um Nokia tijolão.", cat: "filtros" },
            { cmd: "/pet", desc: "Cria um GIF de uma mão fazendo carinho na imagem.", cat: "filtros" },
            { cmd: "/uncover", desc: "Aplica o filtro de lençóis na imagem.", cat: "filtros" },
            { cmd: "/wanted", desc: "Cria um cartaz de 'Procurado' do velho oeste.", cat: "filtros" },

            // GERADOR DE MEMES
            { cmd: "/alert", desc: "Gera meme de aviso/alerta do celular.", cat: "memes" },
            { cmd: "/caution", desc: "Meme de faixa amarela de cuidado.", cat: "memes" },
            { cmd: "/drake", desc: "Meme do Drake (Não gosta / Gosta). Separe as frases por |.", cat: "memes" },
            { cmd: "/oogway", desc: "Meme da tartaruga Mestre Oogway com sua frase.", cat: "memes" },
            { cmd: "/opinion", desc: "Meme de 'minha opinião honesta'.", cat: "memes" },
            { cmd: "/pikachu", desc: "Meme do Pikachu surpreso com sua frase.", cat: "memes" },
            { cmd: "/pooh", desc: "Meme do Ursinho Pooh (Normal / Chique). Separe por |.", cat: "memes" },
            { cmd: "/sadcat", desc: "Meme do gatinho triste chorando.", cat: "memes" },
            { cmd: "/supreme", desc: "Cria a logo da Supreme com o seu texto.", cat: "memes" },
            { cmd: "/quoteimg", desc: "Gera imagem de citação. Separe frase e autor por |.", cat: "memes" },

            // FERRAMENTAS E TEXTOS
            { cmd: "/encode", desc: "Converte o texto digitado para código binário.", cat: "texto" },
            { cmd: "/decode", desc: "Traduz um código binário de volta para texto.", cat: "texto" },
            { cmd: "/morse", desc: "Converte o texto para Código Morse.", cat: "texto" }
        ];

        const listaContainer = document.getElementById("lista-comandos");
        const noResults = document.getElementById("no-results");

        function renderizarComandos(filtroTexto = "", categoria = "todos") {
            listaContainer.innerHTML = "";
            let contagem = 0;

            comandos.forEach(c => {
                const textoMatch = c.cmd.toLowerCase().includes(filtroTexto.toLowerCase()) || c.desc.toLowerCase().includes(filtroTexto.toLowerCase());
                const catMatch = categoria === "todos" || c.cat === categoria;

                if (textoMatch && catMatch) {
                    contagem++;
                    listaContainer.innerHTML += `
                        <div class="cmd-card">
                            <div class="cmd-info">
                                <h3>${c.cmd}</h3>
                                <p>${c.desc}</p>
                            </div>
                            <button class="btn-copy" onclick="copiarComando('${c.cmd}', this)" title="Copiar Comando">
                                <i class='bx bx-copy'></i>
                            </button>
                        </div>
                    `;
                }
            });

            noResults.style.display = contagem === 0 ? "block" : "none";
        }

        function copiarComando(texto, botao) {
            navigator.clipboard.writeText(texto);
            const icon = botao.querySelector('i');
            
            botao.classList.add('copied');
            icon.className = 'bx bx-check';
            
            setTimeout(() => {
                botao.classList.remove('copied');
                icon.className = 'bx bx-copy';
            }, 2000);
        }

        let categoriaAtual = "todos";
        function filtrar(cat) {
            categoriaAtual = cat;
            document.querySelectorAll(".btn-filtro").forEach(b => b.classList.remove("active"));
            event.target.classList.add("active");
            renderizarComandos(document.getElementById("search").value, categoriaAtual);
        }

        document.getElementById("search").addEventListener("input", (e) => {
            renderizarComandos(e.target.value, categoriaAtual);
        });

        renderizarComandos();
    </script>
</body>
</html>
