<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comunidades 💬</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        
        :root {
            /* Cores Estilo iOS Dark Mode & WhatsApp */
            --ios-bg: #000000;
            --ios-glass: rgba(28, 28, 30, 0.65);
            --ios-border: rgba(255, 255, 255, 0.1);
            --wa-green: #25D366;
            --wa-green-dark: #1DA851;
            --text-main: #FFFFFF;
            --text-muted: rgba(235, 235, 245, 0.6);
            --ios-blue: #0A84FF;
        }

        body {
            background-color: var(--ios-bg);
            color: var(--text-main);
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Inter', sans-serif;
            margin: 0; padding: 0;
            /* Um fundo super sutil que lembra o padrão do whatsapp dark */
            background-image: radial-gradient(circle at 50% 0%, rgba(37, 211, 102, 0.05), transparent 60%);
            background-attachment: fixed; min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Topbar Estilo iPhone */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; position: sticky; top: 0; z-index: 100;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--ios-border);
        }
        
        .header-title { font-weight: 600; font-size: 17px; position: absolute; left: 50%; transform: translateX(-50%); }
        
        .btn-nav { color: var(--ios-blue); text-decoration: none; font-size: 17px; display: flex; align-items: center; gap: 4px; }
        .btn-nav:active { opacity: 0.7; }
        .btn-nav i { font-size: 22px; }

        .container { max-width: 800px; margin: 0 auto; }

        /* Título Principal */
        .page-header { padding: 20px 20px 10px 20px; }
        .page-header h1 { font-size: 32px; font-weight: 700; margin: 0 0 5px 0; letter-spacing: -0.5px; }
        .page-header p { color: var(--text-muted); font-size: 15px; margin: 0; }

        /* Filtros iOS Segmented Control Vibe */
        .categories-wrapper { padding: 10px 20px 20px 20px; }
        .categories { 
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        
        .btn-cat {
            background: var(--ios-glass); border: 0.5px solid var(--ios-border); color: var(--text-main);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; 
            white-space: nowrap; transition: 0.2s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .btn-cat.active { background: var(--wa-green); color: #000; border-color: var(--wa-green); font-weight: 600; }

        /* Lista de Chats (WhatsApp Style) */
        .chat-list {
            background: var(--ios-glass);
            border-top: 0.5px solid var(--ios-border);
            border-bottom: 0.5px solid var(--ios-border);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }

        .chat-item {
            display: flex; align-items: center; padding: 12px 20px;
            text-decoration: none; color: inherit; cursor: pointer;
            transition: background 0.2s; position: relative;
        }
        .chat-item:active { background: rgba(255, 255, 255, 0.05); }
        
        /* Linha divisória típica do iOS */
        .chat-item:not(:last-child)::after {
            content: ''; position: absolute; bottom: 0; left: 84px; right: 0;
            height: 0.5px; background: var(--ios-border);
        }

        .chat-avatar {
            width: 54px; height: 54px; border-radius: 50%; object-fit: cover;
            margin-right: 14px; background: #222; flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chat-info { flex: 1; overflow: hidden; padding-right: 10px; }
        
        .chat-header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
        .chat-title { font-weight: 600; font-size: 17px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
        .chat-meta { font-size: 13px; color: var(--text-muted); flex-shrink: 0; display: flex; align-items: center; gap: 4px; }
        
        .chat-desc { font-size: 15px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }

        .wa-badge { 
            display: inline-block; background: rgba(37, 211, 102, 0.15); color: var(--wa-green); 
            padding: 2px 8px; border-radius: 12px; font-weight: 600; font-size: 11px; margin-top: 5px;
            border: 1px solid rgba(37, 211, 102, 0.2); text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* Loader */
        #loading-area { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        #loading-area i { font-size: 32px; color: var(--text-muted); margin-bottom: 10px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; color: rgba(255,255,255,0.2); margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <a href="/index.html" class="btn-nav"><i class='bx bx-chevron-left'></i> Shard</a>
        <div class="header-title">Comunidades</div>
        <a href="/comunidades/enviar.html" class="btn-nav"><i class='bx bx-plus-circle'></i></a>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Descobrir 📱</h1>
            <p>Entre nos melhores grupos validados pelo bot.</p>
        </div>

        <div class="categories-wrapper">
            <div class="categories" id="filtros">
                <button class="btn-cat active">Todos</button>
                <button class="btn-cat">Amizade 🤝</button>
                <button class="btn-cat">Jogos 🎮</button>
                <button class="btn-cat">Memes 😂</button>
                <button class="btn-cat">Estudos 📚</button>
                <button class="btn-cat">+18 🔞</button>
            </div>
        </div>

        <div id="loading-area">
            <i class='bx bx-loader-alt'></i>
            <p>Conectando ao servidor...</p>
        </div>

        <div class="chat-list" id="lista-grupos" style="display: none;">
            </div>
    </div>

    <script>
        async function carregarGrupos(categoria = 'Todos') {
            const list = document.getElementById('lista-grupos');
            const loading = document.getElementById('loading-area');
            
            list.innerHTML = '';
            list.style.display = 'none';
            loading.style.display = 'block';

            try {
                // Remove os emojis do nome da categoria para a busca na API funcionar certinho
                const categoriaLimpa = categoria.replace(/[^a-zA-Z0-9+ ]/g, '').trim();

                const url = categoriaLimpa === 'Todos' 
                    ? 'https://apishard.squareweb.app/api/comunidades'
                    : `https://apishard.squareweb.app/api/comunidades?categoria=${categoriaLimpa}`;
                
                const resposta = await fetch(url);
                const grupos = await resposta.json();
                
                loading.style.display = 'none';
                list.style.display = 'block';

                if (grupos.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <i class='bx bx-ghost'></i>
                            <p>Nenhum grupo encontrado nesta categoria.</p>
                        </div>`;
                    return;
                }

                grupos.forEach(grupo => {
                    list.innerHTML += `
                        <div class="chat-item" onclick="verGrupo('${grupo._id}')">
                            <img src="${grupo.imagem}" alt="Avatar" class="chat-avatar" onerror="this.src='https://i.imgur.com/Qm8plwA.jpeg'">
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <h3 class="chat-title">${grupo.nome}</h3>
                                    <div class="chat-meta">${grupo.visualizacoes} <i class='bx bx-show'></i></div>
                                </div>
                                <p class="chat-desc">${grupo.descricao}</p>
                                <span class="wa-badge">${grupo.categoria}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (erro) {
                console.error("Erro:", erro);
                loading.innerHTML = `<p style="color: var(--text-muted);">Erro ao carregar as conversas.</p>`;
            }
        }

        document.querySelectorAll('.btn-cat').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                carregarGrupos(e.target.innerText);
            });
        });

        async function verGrupo(id) {
            let gruposVisitados = JSON.parse(localStorage.getItem('gruposVisitados_Shard') || '[]');

            if (!gruposVisitados.includes(id)) {
                try {
                    await fetch(`https://apishard.squareweb.app/api/comunidades/${id}/clique`, { method: 'POST' });
                    gruposVisitados.push(id);
                    localStorage.setItem('gruposVisitados_Shard', JSON.stringify(gruposVisitados));
                } catch (erro) {
                    console.log("Ignorado");
                }
            }
            
            window.location.href = `/comunidades/detalhes.html?id=${id}`;
        }

        carregarGrupos();
    </script>
</body>
</html>
