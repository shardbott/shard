<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidades - Shard Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        :root {
            --bg-base: #030708;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --glass-bg: rgba(15, 22, 18, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
            --neon-green: #00E676;
        }
        body {
            background-color: var(--bg-base); color: var(--text-main);
            font-family: 'Inter', sans-serif; margin: 0; padding: 0;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.08), transparent 50%);
            background-attachment: fixed; min-height: 100vh;
        }
        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 24px;
            background: rgba(3, 7, 8, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100;
        }
        
        .btn-nav-logo { color: #fff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-nav-logo:hover { color: var(--neon-green); }

        /* Novos Estilos para os Botões do Cabeçalho */
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-head-sec { background: rgba(255,255,255,0.05); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; border: 1px solid var(--glass-border); text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; white-space: nowrap; font-size: 14px; }
        .btn-head-sec:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .btn-head-pri { background: var(--neon-green); color: #000; padding: 10px 16px; border-radius: 12px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; white-space: nowrap; font-size: 14px; border: 1px solid var(--neon-green); }
        .btn-head-pri:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3); }

        /* Responsividade para não quebrar no celular */
        @media (max-width: 500px) {
            .btn-head-sec span, .btn-head-pri span, .btn-nav-logo span { display: none; }
            .btn-head-sec, .btn-head-pri { padding: 10px 12px; font-size: 20px; }
            .btn-nav-logo { font-size: 26px; }
        }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; text-align: left; }
        h1 { font-size: 32px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -1px; }
        p.subtitle { color: var(--text-muted); margin: 0 0 40px 0; font-size: 15px; }

        .categories { display: flex; gap: 10px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 10px; }
        .categories::-webkit-scrollbar { height: 4px; }
        .categories::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .btn-cat {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); color: var(--text-muted);
            padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.3s; white-space: nowrap;
        }
        .btn-cat.active, .btn-cat:hover { background: var(--neon-green); color: #000; border-color: var(--neon-green); }

        .groups-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 750px) { .groups-grid { grid-template-columns: 1fr 1fr; } }

        .group-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px;
            overflow: hidden; display: flex; flex-direction: column; backdrop-filter: blur(10px);
            transition: all 0.3s ease; box-shadow: var(--glass-shadow);
        }
        .group-card:hover { border-color: rgba(0, 230, 118, 0.3); transform: translateY(-3px); }
        
        .card-banner { width: 100%; height: 160px; background: #111; overflow: hidden; position: relative; }
        .card-banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; }
        .card-tag { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--neon-green); border: 1px solid rgba(0, 230, 118, 0.2); }

        .card-content { padding: 20px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .card-content h3 { margin: 0 0 10px 0; font-size: 18px; font-weight: 700; color: #fff; }
        .card-content p { margin: 0 0 20px 0; font-size: 13.5px; color: var(--text-muted); line-height: 1.5; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        .card-views { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .card-views i { font-size: 16px; color: var(--neon-green); }
        
        .btn-view {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;
            padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; transition: 0.3s;
        }
        .btn-view:hover { background: var(--neon-green); color: #000; border-color: var(--neon-green); }

        #loading-area { text-align: center; padding: 50px 20px; color: var(--text-muted); grid-column: 1 / -1; }
        #loading-area i { font-size: 40px; color: var(--neon-green); margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <a href="/index.html" class="btn-nav-logo"><i class='bx bx-left-arrow-alt'></i> <span>Shard Bot</span></a>
        
        <div class="header-actions">
            <a href="/comunidades/painel.html" class="btn-head-sec">
                <i class='bx bx-user'></i> <span>Meus Grupos</span>
            </a>
            <a href="/comunidades/enviar.html" class="btn-head-pri">
                <i class='bx bx-plus'></i> <span>Enviar Grupo</span>
            </a>
        </div>
    </header>

    <div class="container">
        <h1>Descobrir Comunidades</h1>
        <p class="subtitle">Explore e entre nos melhores grupos e canais do WhatsApp revisados pelos nossos moderadores.</p>

        <div class="categories" id="filtros">
            <button class="btn-cat active">Todos</button>
            <button class="btn-cat">Amizade</button>
            <button class="btn-cat">Jogos</button>
            <button class="btn-cat">Memes</button>
            <button class="btn-cat">Estudos</button>
            <button class="btn-cat">Vendas</button>
            <button class="btn-cat">+18</button>
        </div>

        <div class="groups-grid" id="lista-grupos"></div>

        <div id="loading-area">
            <i class='bx bx-loader-alt bx-spin'></i>
            <p>Buscando comunidades incríveis...</p>
        </div>
    </div>

    <script>
        async function carregarGrupos(categoria = 'Todos') {
            const grid = document.getElementById('lista-grupos');
            const loading = document.getElementById('loading-area');
            
            grid.innerHTML = '';
            loading.style.display = 'block';

            try {
                const url = categoria === 'Todos' 
                    ? 'https://apishard.squareweb.app/api/comunidades'
                    : `https://apishard.squareweb.app/api/comunidades?categoria=${categoria}`;
                
                const resposta = await fetch(url);
                const grupos = await resposta.json();
                
                loading.style.display = 'none';

                if (grupos.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888; background: var(--glass-bg); border-radius: 20px; border: 1px dashed var(--glass-border);">
                            <i class='bx bx-ghost' style="font-size: 40px; margin-bottom: 10px;"></i>
                            <p>Nenhum grupo encontrado nesta categoria.</p>
                            <a href="/comunidades/enviar.html" style="color: var(--neon-green); text-decoration: none; font-weight: 600;">Seja o primeiro a enviar!</a>
                        </div>`;
                    return;
                }

                grupos.forEach(grupo => {
                    grid.innerHTML += `
                        <div class="group-card">
                            <div class="card-banner">
                                <span class="card-tag">${grupo.categoria}</span>
                                <img src="${grupo.imagem || 'https://i.imgur.com/Qm8plwA.jpeg'}" alt="Banner Grupo">
                            </div>
                            <div class="card-content">
                                <h3>${grupo.nome}</h3>
                                <p>${grupo.descricao}</p>
                                <div class="card-footer">
                                    <div class="card-views"><i class='bx bx-show'></i> <span>${grupo.visualizacoes}</span> acessos</div>
                                    <a onclick="verGrupo('${grupo._id}', this)" class="btn-view">Ver Grupo</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (erro) {
                console.error("Erro ao buscar grupos:", erro);
                loading.innerHTML = `<p style="color: #ff4757;"><i class='bx bx-error'></i> Erro ao carregar as comunidades.</p>`;
            }
        }

        document.querySelectorAll('.btn-cat').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                carregarGrupos(e.target.innerText);
            });
        });

        async function verGrupo(id, botaoClicado) {
            botaoClicado.innerText = "Abrindo...";
            botaoClicado.style.pointerEvents = "none"; 

            let gruposVisitados = JSON.parse(localStorage.getItem('gruposVisitados_Shard') || '[]');

            if (!gruposVisitados.includes(id)) {
                try {
                    await fetch(`https://apishard.squareweb.app/api/comunidades/${id}/clique`, { method: 'POST' });
                    gruposVisitados.push(id);
                    localStorage.setItem('gruposVisitados_Shard', JSON.stringify(gruposVisitados));
                } catch (erro) {
                    console.log("Ignorado");
                }
            }
            
            window.location.href = `/comunidades/detalhes.html?id=${id}`;
        }

        carregarGrupos();
    </script>
</body>
</html>
