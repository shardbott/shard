<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divulgar Grupo - Shard Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        :root {
            --bg-base: #030708;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --glass-bg: rgba(15, 22, 18, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-green: #00E676;
        }
        body {
            background-color: var(--bg-base); color: var(--text-main);
            font-family: 'Inter', sans-serif; margin: 0; padding: 0;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.08), transparent 50%);
            background-attachment: fixed; min-height: 100vh;
        }
        header { padding: 20px 24px; border-bottom: 1px solid var(--glass-border); background: rgba(3, 7, 8, 0.6); }
        .btn-voltar { color: #fff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; text-align: left; }
        h1 { font-size: 28px; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.5px; }
        p.desc { color: var(--text-muted); margin: 0 0 30px 0; font-size: 14.5px; line-height: 1.5; }

        form { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 30px; border-radius: 24px; box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #fff; }
        
        .form-control {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            padding: 12px 16px; border-radius: 12px; color: #fff; font-size: 15px; font-family: 'Inter', sans-serif; transition: 0.3s;
        }
        select.form-control { cursor: pointer; appearance: none; }
        select.form-control option { background: #111; color: #fff; }
        .form-control:focus { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 230, 118, 0.15); }
        textarea.form-control { resize: none; height: 100px; }

        .regras-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; margin-bottom: 15px; }
        @media(min-width: 450px) { .regras-grid { grid-template-columns: 1fr 1fr; } }
        
        .check-item {
            display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.02);
            padding: 12px; border-radius: 10px; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.2s;
        }
        .check-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
        .check-item input { accent-color: var(--neon-green); width: 16px; height: 16px; cursor: pointer; }
        .check-item span { font-size: 13.5px; color: var(--text-muted); }

        .btn-enviar {
            width: 100%; background: var(--neon-green); color: #000; border: none; padding: 14px;
            border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 25px; transition: 0.3s;
        }
        .btn-enviar:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 230, 118, 0.3); }
        .btn-enviar:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Estilos do Toast (Substitui o alert nativo) */
        #toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(15, 22, 18, 0.95); border: 1px solid var(--neon-green); color: #fff; padding: 14px 24px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(10px); animation: slideUp 0.3s ease forwards; }
        .toast.error { border-color: #ff4757; }
        .toast.error i { color: #ff4757; }
        .toast i { color: var(--neon-green); font-size: 22px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body>

    <header>
        <a href="/comunidades/index.html" class="btn-voltar"><i class='bx bx-left-arrow-alt' style="font-size: 24px;"></i> Voltar para a Lista</a>
    </header>

    <div class="container">
        <h1>Divulgar nova comunidade</h1>
        <p class="desc">Insira o link oficial do grupo ou canal. Nosso bot validará o nome e a imagem automaticamente, mantendo a listagem confiável.</p>

        <form onsubmit="enviarGrupoForm(event)">
            <div class="form-group">
                <label>Link do Grupo / Canal</label>
                <input type="url" class="form-control" placeholder="https://chat.whatsapp.com/..." required id="link-grupo">
            </div>

            <div class="form-group">
                <label>Número do WhatsApp do Dono (Para Gerenciamento)</label>
                <input type="tel" class="form-control" placeholder="Ex: 5511999999999" required id="dono-grupo">
            </div>
            
            <div class="form-group">
                <label>Crie uma Senha (Para editar ou apagar o grupo depois)</label>
                <input type="password" class="form-control" placeholder="Ex: 123456" required id="senha-grupo">
            </div>

            <div class="form-group">
                <label>Categoria do Grupo</label>
                <select class="form-control" id="categoria-grupo" required>
                    <option value="" disabled selected>Selecione uma categoria...</option>
                    <option value="Amizade">Amizade</option>
                    <option value="Jogos">Jogos</option>
                    <option value="Memes">Memes</option>
                    <option value="Estudos">Estudos</option>
                    <option value="+18">+18 (Conteúdo Adulto)</option>
                    <option value="Vendas">Vendas e Negócios</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label>Breve Descrição</label>
                <textarea class="form-control" placeholder="Diga sobre o que é o seu grupo de forma atrativa..." required id="desc-grupo"></textarea>
            </div>

            <div class="form-group">
                <label>Regras da Comunidade</label>
                <div class="regras-grid">
                    <label class="check-item"><input type="checkbox" value="Proibido conteúdo adulto"><span>Proibido conteúdo adulto</span></label>
                    <label class="check-item"><input type="checkbox" value="Proibido conteúdo agressivo"><span>Proibido agressividade</span></label>
                    <label class="check-item"><input type="checkbox" value="Proibido uso de palavrões"><span>Proibido palavrões</span></label>
                    <label class="check-item"><input type="checkbox" value="Proibido trava zap"><span>Proibido trava zap</span></label>
                </div>
                <input type="text" class="form-control" id="regras-custom" placeholder="Outras regras? Separe por vírgula. Ex: Proibido áudio, Só admins falam">
            </div>

            <button type="submit" class="btn-enviar">Enviar para Análise</button>
        </form>
    </div>

    <script>
        // Função para mostrar notificações Toast
        function mostrarAviso(mensagem, erro = false) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${erro ? 'error' : ''}`;
            toast.innerHTML = `<i class='bx ${erro ? 'bx-error-circle' : 'bx-check-circle'}'></i> <span>${mensagem}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function enviarGrupoForm(event) {
            event.preventDefault();

            const btn = document.querySelector('.btn-enviar');
            const textoOriginal = btn.innerText;
            btn.innerText = "Enviando...";
            btn.disabled = true;

            const link = document.getElementById('link-grupo').value;
            const numeroDono = document.getElementById('dono-grupo').value;
            const senha = document.getElementById('senha-grupo').value;
            const categoria = document.getElementById('categoria-grupo').value;
            const descricao = document.getElementById('desc-grupo').value;

            // Pega as caixinhas marcadas
            const checkboxes = document.querySelectorAll('.regras-grid input[type="checkbox"]:checked');
            let regras = Array.from(checkboxes).map(cb => cb.value);

            // Pega o texto livre, separa por vírgula, limpa os espaços e adiciona à lista de regras
            const regrasCustom = document.getElementById('regras-custom').value;
            if (regrasCustom.trim() !== "") {
                const regrasExtras = regrasCustom.split(',').map(r => r.trim()).filter(r => r);
                regras = regras.concat(regrasExtras);
            }

            const dadosGrupo = {
                link: link,
                numeroDono: numeroDono,
                senha: senha,
                descricao: descricao,
                regras: regras,
                categoria: categoria 
            };

            try {
                const resposta = await fetch('https://apishard.squareweb.app/api/comunidades', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosGrupo)
                });

                const resultado = await resposta.json();

                if (resultado.sucesso) {
                    mostrarAviso("✨ Sucesso! Seu grupo foi enviado e está na fila para aprovação manual.");
                    setTimeout(() => window.location.href = "/comunidades/index.html", 2500);
                } else {
                    mostrarAviso(resultado.erro || "Tente novamente mais tarde.", true);
                    btn.innerText = textoOriginal;
                    btn.disabled = false;
                }
            } catch (erro) {
                console.error("Erro na requisição:", erro);
                mostrarAviso("Erro de conexão com o servidor. Tente novamente.", true);
                btn.innerText = textoOriginal;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
