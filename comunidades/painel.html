<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel - Shard Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        :root {
            --bg-base: #030708;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --glass-bg: rgba(15, 22, 18, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-green: #00E676;
            --warning-yellow: #fbc531;
            --danger-red: #ff4757;
        }
        body {
            background-color: var(--bg-base); color: var(--text-main);
            font-family: 'Inter', sans-serif; margin: 0; padding: 0;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 230, 118, 0.05), transparent 50%);
            background-attachment: fixed; min-height: 100vh;
        }
        
        header { padding: 20px 24px; border-bottom: 1px solid var(--glass-border); background: rgba(3, 7, 8, 0.6); backdrop-filter: blur(10px); }
        .btn-voltar { color: #fff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-voltar:hover { color: var(--neon-green); }

        .container { max-width: 700px; margin: 50px auto; padding: 0 20px; }

        #login-area {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 24px; text-align: center; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #login-area i { font-size: 50px; color: var(--neon-green); margin-bottom: 15px; }
        #login-area h2 { margin: 0 0 10px 0; font-size: 24px; }
        #login-area p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        .form-control {
            width: 100%; max-width: 400px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            padding: 14px 20px; border-radius: 12px; color: #fff; font-size: 16px; font-family: 'Inter', sans-serif; transition: 0.3s; margin-bottom: 20px; text-align: center;
        }
        .form-control:focus { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(0, 230, 118, 0.15); }
        
        .btn-primary {
            background: var(--neon-green); color: #000; border: none; padding: 14px 30px;
            border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 230, 118, 0.3); }
        .btn-primary:disabled { opacity: 0.7; cursor: wait; }

        #dashboard-area { display: none; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .dash-header h1 { margin: 0; font-size: 28px; }
        .dash-header a { background: rgba(255,255,255,0.05); color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; border: 1px solid var(--glass-border); transition: 0.3s; }
        .dash-header a:hover { background: rgba(255,255,255,0.1); }

        .gerenciar-grid { display: flex; flex-direction: column; gap: 20px; }
        .manage-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-left: 4px solid var(--neon-green);
            padding: 20px; border-radius: 16px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 15px;
        }
        .manage-card.pendente { border-left-color: var(--warning-yellow); }
        
        .mc-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .mc-info h3 { margin: 0 0 5px 0; font-size: 18px; }
        .mc-info p { margin: 0; font-size: 13px; color: var(--text-muted); }
        
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.aprovado { background: rgba(0, 230, 118, 0.1); color: var(--neon-green); border: 1px solid rgba(0, 230, 118, 0.3); }
        .badge.pendente { background: rgba(251, 197, 49, 0.1); color: var(--warning-yellow); border: 1px solid rgba(251, 197, 49, 0.3); }

        .mc-actions { display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; flex-wrap: wrap; }
        .btn-action {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;
            padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-action:hover { background: rgba(255,255,255,0.1); }
        .btn-action.delete:hover { background: rgba(255, 71, 87, 0.1); color: var(--danger-red); border-color: rgba(255, 71, 87, 0.3); }
    </style>
</head>
<body>

    <header>
        <a href="/comunidades/index.html" class="btn-voltar"><i class='bx bx-left-arrow-alt' style="font-size: 24px;"></i> Voltar</a>
    </header>

    <div class="container">
        <div id="login-area">
            <i class='bx bx-lock-alt'></i>
            <h2>Acessar Meus Grupos</h2>
            <p>Digite seu número de WhatsApp e senha usado para cadastrar os seus grupos. Sem espaços ou símbolos.</p>
            <input type="tel" class="form-control" id="numero-login" placeholder="Ex: 5511999999999" autocomplete="off">
            <input type="password" class="form-control" id="senha-login" placeholder="Sua senha de gerenciamento" autocomplete="off">
            <br>
            <button class="btn-primary" onclick="acessarPainel()">Continuar</button>
        </div>

        <div id="dashboard-area">
            <div class="dash-header">
                <h1>Meus Grupos</h1>
                <a href="#" onclick="sairPainel()"><i class='bx bx-log-out'></i> Sair</a>
            </div>

            <div class="gerenciar-grid">
                </div>
        </div>
    </div>

    <script>
        async function acessarPainel() {
            // Pega o número digitado e remove espaços ou traços
            const numeroRaw = document.getElementById('numero-login').value;
            const numero = numeroRaw.replace(/\D/g, ''); 

            if(numero.length < 10) {
                alert("Por favor, insira um número válido com DDD (apenas números).");
                return;
            }

            const btn = document.querySelector('.btn-primary');
            const txtOriginal = btn.innerText;
            btn.innerText = "Buscando...";
            btn.disabled = true;

            try {
                // Faz a busca na sua API pelo número do dono
                const resposta = await fetch(`https://apishard.squareweb.app/api/comunidades/dono/${numero}`);
                const grupos = await resposta.json();

                btn.innerText = txtOriginal;
                btn.disabled = false;

                if (grupos.erro) {
                    alert("Erro ao buscar grupos no servidor.");
                    return;
                }

                // Troca a tela
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('dashboard-area').style.display = 'block';

                const grid = document.querySelector('.gerenciar-grid');
                grid.innerHTML = ''; // Limpa a grade antes de adicionar

                // Se o usuário não tem grupos
                if (grupos.length === 0) {
                    grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Você ainda não enviou nenhum grupo com este número.</p>';
                    return;
                }

                // Cria os cards para cada grupo que o usuário possui
                grupos.forEach(grupo => {
                    const dataObj = new Date(grupo.dataEnvio);
                    const dataFormatada = dataObj.toLocaleDateString('pt-BR');
                    
                    // Define as cores e textos com base no status do banco de dados
                    const badgeClass = grupo.status === 'aprovado' ? 'aprovado' : 'pendente';
                    const badgeTexto = grupo.status === 'aprovado' ? 'Aprovado' : 'Pendente';
                    const cardClass = grupo.status === 'pendente' ? 'pendente' : '';
                    const nomeExibicao = grupo.nome !== 'Aguardando bot...' ? grupo.nome : 'Grupo em Análise';

                    grid.innerHTML += `
                        <div class="manage-card ${cardClass}">
                            <div class="mc-header">
                                <div class="mc-info">
                                    <h3>${nomeExibicao}</h3>
                                    <p>Enviado em ${dataFormatada} • ${grupo.visualizacoes} acessos</p>
                                </div>
                                <span class="badge ${badgeClass}">${badgeTexto}</span>
                            </div>
                            <div class="mc-actions">
                                <button class="btn-action" onclick="editarAlerta()"><i class='bx bx-link'></i> Trocar Link</button>
                                <button class="btn-action" onclick="editarAlerta()"><i class='bx bx-edit'></i> Editar</button>
                                <button class="btn-action delete" onclick="excluirAlerta()"><i class='bx bx-trash'></i> Excluir</button>
                            </div>
                        </div>
                    `;
                });

            } catch (erro) {
                console.error(erro);
                alert("❌ Erro de conexão com o servidor.");
                btn.innerText = txtOriginal;
                btn.disabled = false;
            }
        }

        function sairPainel() {
            document.getElementById('numero-login').value = '';
            document.getElementById('dashboard-area').style.display = 'none';
            document.getElementById('login-area').style.display = 'block';
            document.querySelector('.gerenciar-grid').innerHTML = '';
        }

        function editarAlerta() {
            alert("Atenção: Ao editar os dados, seu grupo voltará para o status 'Pendente' e precisará ser aprovado novamente. (Função em desenvolvimento)");
        }

        function excluirAlerta() {
            alert("Você tem certeza? A exclusão não poderá ser desfeita. (Função em desenvolvimento)");
        }
    </script>
</body>
</html>
